<!DOCTYPE html>

<head>

  body {
    margin: 0;
    background: white;
    color: black;
    font-family: Arial, sans-serif;

  main {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;

  }

  .pickaxe {
    width: 80px;
    height: 80px;
    flex-shrink: 0;
  }

  h1 {
    margin: 0;
    color: black;
    font-size: clamp(32px, 7vw, 80px);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.04em;
  }
</style>

<body>
  <main>
